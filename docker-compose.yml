services:
  backend:
    build:
      context: ./backend
    environment:
      CV_ENV: development
      CV_DEV_USER_ID: 00000000-0000-4000-8000-000000000001
      CV_AUTO_CREATE_SCHEMA: "true"
      CV_LLM_ENCRYPTION_KEY: ${CV_LLM_ENCRYPTION_KEY:?Set a 64-character hexadecimal AES-256 key in .env}
      DATABASE_URL: sqlite+pysqlite:///./data/cv_profiles.sqlite3
    volumes:
      - cv_profiles_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  cv_profiles_data:
