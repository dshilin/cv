[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-profile-backend"
version = "0.1.0"
description = "Backend for candidate facts and specialization profiles"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=49,<51",
    "fastapi>=0.115,<1",
    "httpcore>=1,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
    "SQLAlchemy>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "anyio>=4,<4.11",
    "pytest>=8,<10",
    "starlette>=0.46,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
